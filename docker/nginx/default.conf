upstream booster_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /static/ {
        proxy_pass http://booster_app;
    }

    location /media/ {
        proxy_pass http://booster_app;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://booster_app;
    }
}

