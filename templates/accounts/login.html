{% extends "base_public.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
  <div class="card-intro">
    <h2>Sign in</h2>
    <p class="muted">Use your workspace credentials to continue.</p>
  </div>
  <form method="post" class="form-grid">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>
      <span>Email</span>
      {{ form.email }}
    </label>
    <label>
      <span>Password</span>
      {{ form.password }}
    </label>
    <button type="submit" class="button">Continue</button>
  </form>
  <div class="helper-links">
    <a href="{% url 'accounts:password-reset' %}">Forgot password?</a>
    <a href="{% url 'accounts:register' %}">Create workspace</a>
  </div>
{% endblock %}
