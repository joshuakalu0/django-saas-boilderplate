[project]
name = "booster-saas-django"
version = "0.1.0"
description = "Enterprise-grade multi-tenant SaaS starter built with Django and django-tenants."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.4,<6.0",
  "dj-database-url>=2.2,<3.0",
  "django>=5.1,<5.3",
  "django-allauth>=65.0,<66.0",
  "django-environ>=0.11,<0.12",
  "django-filter>=24.2,<25.0",
  "django-htmx>=1.19,<1.23",
  "django-tenants>=3.10,<4.0",
  "djangorestframework>=3.15,<3.16",
  "djangorestframework-simplejwt>=5.3,<5.5",
  "drf-spectacular>=0.27,<0.29",
  "gunicorn>=23.0,<24.0",
  "psycopg[binary]>=3.2,<3.3",
  "redis>=5.0,<6.0",
  "stripe>=11.0,<12.0",
  "whitenoise>=6.8,<7.0"
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8.0",
  "factory-boy>=3.3,<4.0",
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "ruff>=0.6,<0.9"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "DJ"]

[tool.coverage.run]
branch = true
source = [
  "accounts",
  "api",
  "billing",
  "common",
  "config",
  "tenants",
  "workspace",
]
